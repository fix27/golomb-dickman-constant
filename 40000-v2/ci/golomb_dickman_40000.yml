# Template CI pipeline for the 40,000-digit certificate.
#
# Copy to .github/workflows/golomb_dickman_40000.yml to activate.  The compute
# and replay jobs need a 16-vCPU runner; on a stock 4-vCPU GitHub runner the
# 10-hour timeout is not enough.  All text artefacts are LF; verify_40000.py
# hashes LF-normalised bytes, so a CRLF runner cannot invalidate the checks.
name: golomb-dickman-40000

on:
  workflow_dispatch:
  push:
    paths:
      - "40000-v2/**"

jobs:
  compute:
    name: Compute 40000 digits (strict)
    runs-on: [self-hosted, linux, x64, 16vcpu]
    timeout-minutes: 600
    defaults:
      run:
        working-directory: 40000-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[crosscheck]
      - name: Self-test
        run: |
          python golomb_dickman_27.py test
          python golomb_dickman_27.py smoke
      - name: Strict certificate
        run: |
          python golomb_dickman_27.py certify \
            --digits 40000 --guard 30 --jobs 16 --chunk 200 \
            --ckpt gd_rigorous_ckpt_40000 \
            --out golomb_dickman_40000_certified.txt
      - uses: actions/upload-artifact@v4
        with:
          name: certificate-and-checkpoints
          path: |
            40000-v2/golomb_dickman_40000_certified.txt
            40000-v2/gd_rigorous_ckpt_40000/**
          retention-days: 30

  replay:
    name: Level B full Arb replay
    needs: compute
    runs-on: [self-hosted, linux, x64, 16vcpu]
    timeout-minutes: 600
    defaults:
      run:
        working-directory: 40000-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[crosscheck]
      - uses: actions/download-artifact@v4
        with:
          name: certificate-and-checkpoints
          path: artifact
      - name: Replay every node from the plan (no checkpoint input)
        run: |
          python verification/full_arb_replay_40000.py \
            --cert ../artifact/40000-v2/golomb_dickman_40000_certified.txt \
            --jobs 16 --chunk 200 \
            --json level_b_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: level-b-report
          path: 40000-v2/level_b_report.json

  crosscheck:
    name: Level C independent 1000 digits
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: 40000-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mpmath
        run: python -m pip install "mpmath>=1.3"
      - name: Two independent quadrature rules
        run: |
          python verification/crosscheck_1000_mpmath.py \
            --digits 1000 --jobs 2 \
            --json level_c_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: level-c-report
          path: 40000-v2/level_c_report.json

  packaging:
    name: Package LF-only bundle
    needs: [replay, crosscheck]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 40000-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: certificate-and-checkpoints
          path: artifact
      - name: Assemble bundle and force LF
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil, zipfile
          fresh = Path("../artifact/40000-v2/golomb_dickman_40000_certified.txt")
          repo = Path(".")
          bundle = Path("../bundle")
          if bundle.exists():
              shutil.rmtree(bundle)
          bundle.mkdir()
          for name in ("golomb_dickman_40000_certified.txt",
                       "golomb_dickman_40000_digits.txt",
                       "b084945.txt"):
              src = fresh if name.startswith("golomb_dickman_40000_certified") else repo / name
              (bundle / name).write_bytes(src.read_bytes().replace(b"\r\n", b"\n"))
          with zipfile.ZipFile("golomb_dickman_40000_verification.zip", "w",
                               zipfile.ZIP_DEFLATED) as z:
              for name in ("golomb_dickman_40000_certified.txt",
                           "golomb_dickman_40000_digits.txt",
                           "b084945.txt"):
                  z.write(bundle / name, name)
          print("wrote golomb_dickman_40000_verification.zip")
          PY
      - name: Level A check on the fresh bundle
        run: |
          python verification/verify_40000.py --root ../bundle --no-hash --strict-lf
      - uses: actions/upload-artifact@v4
        with:
          name: golomb-dickman-40000-bundle
          path: 40000-v2/golomb_dickman_40000_verification.zip
